name: Remove verified archived Himawari month

on:
  repository_dispatch:
    types: [archive-verified]

permissions:
  contents: write

concurrency:
  group: verified-himawari-cleanup
  cancel-in-progress: false
  queue: max

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate archive manifest and remove source files
        env:
          ARCHIVE_MONTH: ${{ github.event.client_payload.month }}
          ARCHIVE_COMMIT: ${{ github.event.client_payload.archive_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$ARCHIVE_MONTH" =~ ^[0-9]{4}-[0-9]{2}$ ]]; then
            echo "Invalid archive month: $ARCHIVE_MONTH"
            exit 1
          fi
          manifest_url="https://raw.githubusercontent.com/StorywithLove/envdata-archive/$ARCHIVE_COMMIT/Archive/Himawari/_manifests/$ARCHIVE_MONTH.json"
          curl --fail --silent --show-error "$manifest_url" -o /tmp/himawari-manifest.json
          python scripts/cleanup_archived_month.py \
            --month "$ARCHIVE_MONTH" \
            --manifest /tmp/himawari-manifest.json
      - name: Commit source cleanup
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u data/daily/
          if git diff --cached --quiet; then
            echo "No source files needed cleanup."
            exit 0
          fi
          git commit -m "data: remove verified archived Himawari month"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with another writer; retrying ($attempt/5)."
            sleep $((attempt * 2))
          done
          echo "Unable to push source cleanup after 5 attempts."
          exit 1
