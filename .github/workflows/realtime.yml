name: Satellite radiation city data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "config/**"
      - ".github/workflows/realtime.yml"
  schedule:
    # Best-effort 15-minute collection; the satellite product itself has ~30 min latency.
    - cron: "*/15 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: satellite-radiation-collection
  cancel-in-progress: false

jobs:
  collect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy netCDF4
      - name: Collect city radiation data
        env:
          H8_USERNAME: ${{ secrets.H8_USERNAME }}
          H8_PASSWORD: ${{ secrets.H8_PASSWORD }}
        run: python src/radiation_pipeline.py
      - name: Commit latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities/latest.json data/cities/status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh city satellite radiation snapshot"
            git push
          fi
      - name: Prepare dashboard data
        run: |
          mkdir -p web/data
          if [ -f data/cities/latest.json ]; then
            cp data/cities/latest.json web/data/latest.json
          else
            echo '{"records":[],"generated_at_utc":null}' > web/data/latest.json
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
