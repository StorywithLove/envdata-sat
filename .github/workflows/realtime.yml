name: Satellite radiation city data

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: satellite-radiation-collection
  cancel-in-progress: false
  queue: max

jobs:
  collect:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      - name: Collect and upsert hourly city radiation data
        run: python src/radiation_pipeline.py
      - name: Commit latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/cities/
          if [ -d data/daily ]; then
            git add -A data/daily/
          fi
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: update hourly satellite radiation daily CSV"
            # Rebase over concurrent documentation/config commits before pushing.
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                break
              fi
              echo "Push raced with another writer; retrying ($attempt/5)."
              sleep $((attempt * 2))
              if [ "$attempt" -eq 5 ]; then
                echo "Unable to push realtime snapshot after 5 attempts."
                exit 1
              fi
            done
          fi
      - name: Prepare dashboard data
        run: |
          mkdir -p web/data
          if [ -f data/cities/latest.json ]; then
            cp data/cities/latest.json web/data/latest.json
          else
            echo '{"records":[],"generated_at_utc":null}' > web/data/latest.json
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
