name: Satellite radiation city data

on:
  workflow_dispatch:
  schedule:
    # Best-effort 15-minute collection; the satellite product itself has ~30 min latency.
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: satellite-radiation-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy netCDF4
      - name: Collect city radiation data
        env:
          H8_USERNAME: ${{ secrets.H8_USERNAME }}
          H8_PASSWORD: ${{ secrets.H8_PASSWORD }}
        run: python src/radiation_pipeline.py
      - name: Commit latest snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cities/latest.json data/cities/status.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "data: refresh city satellite radiation snapshot"
            git push
          fi
