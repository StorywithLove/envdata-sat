name: Archive daily satellite radiation

on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to archive (YYYY-MM-DD); leave empty for yesterday"
        required: false
        type: string
  schedule:
    - cron: "30 1 * * *"
  push:
    branches: [main]
    paths:
      - "src/radiation_extract.py"
      - "config/cities.json"
      - ".github/workflows/archive-daily.yml"

permissions:
  contents: write

concurrency:
  group: radiation-daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Prepare UTC archive date
        id: archive-date
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.date }}" ]]; then
            archive_date="${{ inputs.date }}"
          else
            archive_date="$(date -u -d 'yesterday' +%F)"
          fi
          if ! [[ "$archive_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid archive date: $archive_date"
            exit 1
          fi
          echo "date=$archive_date" >> "$GITHUB_OUTPUT"
          echo "year=${archive_date:0:4}" >> "$GITHUB_OUTPUT"
          echo "month=${archive_date:5:2}" >> "$GITHUB_OUTPUT"
          echo "compact=${archive_date//-/}" >> "$GITHUB_OUTPUT"
      - name: Run extraction unit tests
        run: python -m unittest discover -s tests -v
      - name: Extract selected UTC day
        run: python src/radiation_extract.py cities --date "${{ steps.archive-date.outputs.date }}"
      - name: Commit daily CSV and quality report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily/
          if git diff --cached --quiet; then
            echo "No daily data changes to commit."
            exit 0
          fi
          git commit -m "Archive satellite radiation for ${{ steps.archive-date.outputs.date }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload selected daily CSV and quality report (30-day convenience copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiation-daily-${{ steps.archive-date.outputs.compact }}
          path: |
            data/daily/${{ steps.archive-date.outputs.year }}/${{ steps.archive-date.outputs.month }}/radiation_${{ steps.archive-date.outputs.compact }}.csv
            data/daily/${{ steps.archive-date.outputs.year }}/${{ steps.archive-date.outputs.month }}/radiation_${{ steps.archive-date.outputs.compact }}.status.json
          if-no-files-found: warn
          retention-days: 30
