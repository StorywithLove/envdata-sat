name: Archive daily satellite radiation

on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to archive (YYYY-MM-DD); leave empty for yesterday"
        required: false
        type: string
  schedule:
    - cron: "30 1 * * *"
  push:
    branches: [main]
    paths:
      - "src/radiation_extract.py"
      - "config/cities.json"
      - ".github/workflows/archive-daily.yml"

permissions:
  contents: write

concurrency:
  group: radiation-daily-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Run extraction unit tests
        run: python -m unittest discover -s tests -v
      - name: Extract previous UTC day
        if: ${{ github.event_name == 'schedule' || inputs.date == '' }}
        run: python src/radiation_extract.py cities
      - name: Extract selected UTC day
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.date != '' }}
        run: python src/radiation_extract.py cities --date "${{ inputs.date }}"
      - name: Commit daily CSV and quality report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/daily/
          if git diff --cached --quiet; then
            echo "No daily data changes to commit."
            exit 0
          fi
          git commit -m "Archive satellite radiation for ${{ inputs.date || 'previous UTC day' }}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Upload daily CSV and quality report (30-day convenience copy)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiation-daily-${{ inputs.date || 'previous-utc-day' }}
          path: |
            data/daily/**/*.csv
            data/daily/**/*.status.json
          if-no-files-found: warn
          retention-days: 30
