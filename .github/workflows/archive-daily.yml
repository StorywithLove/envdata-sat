name: Archive daily satellite radiation

on:
  workflow_dispatch:
    inputs:
      date:
        description: "UTC date to generate (YYYY-MM-DD); leave empty for yesterday"
        required: false
        type: string
  schedule:
    # Generate the previous complete UTC day after the normal satellite data latency.
    - cron: "30 1 * * *"
  push:
    branches: [main]
    paths:
      - "src/radiation_extract.py"
      - "config/cities.json"
      - ".github/workflows/archive-daily.yml"

permissions:
  contents: write

concurrency:
  group: radiation-daily-csv
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Generate previous UTC day
        if: ${{ github.event_name == 'schedule' || inputs.date == '' }}
        run: python src/radiation_extract.py cities
      - name: Generate selected UTC day
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.date != '' }}
        run: python src/radiation_extract.py cities --date "${{ inputs.date }}"
      - name: Commit daily CSV and quality report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily/
          if git diff --cached --quiet; then
            echo "No daily data changes to commit."
          else
            git commit -m "data: archive daily Himawari radiation CSV"
            git pull --rebase origin main
            git push
          fi
      - name: Upload daily CSV and quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radiation-daily-${{ inputs.date || 'previous-utc-day' }}
          path: |
            data/daily/**/*.csv
            data/daily/**/*.status.json
          if-no-files-found: warn
          retention-days: 30
