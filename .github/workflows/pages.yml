name: Deploy radiation dashboard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "data/cities/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          mkdir -p web/data
          if [ -f data/cities/latest.json ]; then
            cp data/cities/latest.json web/data/latest.json
          else
            echo '{"records":[],"generated_at_utc":null}' > web/data/latest.json
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
