<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>中国卫星辐射监测</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172033;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0}header{padding:18px 24px;background:#10243a;color:#fff}
    header h1{margin:0 0 6px;font-size:21px}header p{margin:0;color:#c4d2df;font-size:13px}
    main{max-width:1440px;margin:auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(320px,1fr);gap:16px}
    .panel{background:#fff;border:1px solid #e2e8f0;border-radius:12px;overflow:hidden;min-width:0}
    .panel h2{font-size:15px;margin:0;padding:14px 16px;border-bottom:1px solid #e8edf3}
    #map{height:620px}.side{display:flex;flex-direction:column;min-height:620px}
    /* Chart.js needs a parent with a definite height, otherwise the canvas
       grows every resize pass and the panel stretches to tens of thousands of
       pixels. */
    .chart-box{position:relative;height:250px;margin:12px 0}
    .chart-box canvas{position:absolute;inset:0;width:100%;height:100%}
    .meta{padding:12px 16px;color:#64748b;font-size:12px;line-height:1.7}
    .city-list{overflow:auto;max-height:300px}.city{width:100%;border:0;border-bottom:1px solid #edf1f5;background:#fff;text-align:left;padding:10px 14px;display:flex;justify-content:space-between;gap:12px;cursor:pointer}
    .city:hover,.city.active{background:#eef6ff}.city strong{font-weight:600}.value{font-variant-numeric:tabular-nums}
    .legend{padding:10px 14px;font-size:12px;color:#475569;border-top:1px solid #edf1f5}
    .notice{padding:8px 14px 12px;font-size:12px;line-height:1.6;color:#64748b;border-top:1px solid #edf1f5;background:#fbfcfe}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 5px 0 10px}
    .status{font-size:12px;color:#64748b;padding:12px 16px}
    @media(max-width:900px){main{grid-template-columns:1fr}#map{height:440px}.side{min-height:0}}
  </style>
</head>
<body>
<header><h1>中国省会城市 · 卫星短波辐射监测</h1><p>Himawari-9 GHI · Open-Meteo Satellite Radiation API · W/m²</p></header>
<main>
  <section class="panel"><h2>城市辐射空间分布</h2><div id="map"></div><div class="legend">辐射强度：<span class="dot" style="background:#2563eb"></span>低 <span class="dot" style="background:#16a34a"></span>中 <span class="dot" style="background:#f59e0b"></span>高 <span class="dot" style="background:#dc2626"></span>很高</div><div class="notice">查看中国区域请使用「天地图」底图（矢量 / 影像 / 地形）；高德等其它底图的中国边界显示不准确。</div></section>
  <section class="panel side">
    <h2 id="selected-title">城市时间序列</h2>
    <div class="chart-box"><canvas id="chart"></canvas></div>
    <div id="selected-meta" class="meta">点击地图上的城市查看最近24小时序列。</div>
    <h2>省会城市最新值</h2>
    <div id="city-list" class="city-list"></div>
    <div id="status" class="status">正在加载数据…</div>
  </section>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<script>
  // GitHub Pages serves static files with max-age=600, so a plain ./app.js tag
  // keeps showing the previous deploy for up to ten minutes. Stamp the URL so
  // the next page load always fetches the current script.
  const appScript = document.createElement("script");
  appScript.src = "./app.js?v=" + Date.now();
  document.body.appendChild(appScript);
</script>
</body>
</html>
